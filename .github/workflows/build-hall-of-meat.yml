name: build-hall-of-meat

on:
  push:
    branches: [halfsword]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package (contrib/pack-hall-of-meat.ps1)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File contrib/pack-hall-of-meat.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ReSkate_HallOfMeat
          path: artifacts/*.zip
          if-no-files-found: error
